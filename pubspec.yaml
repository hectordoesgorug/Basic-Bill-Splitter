name: basic_bill_splitter
description: "An offline Android app for splitting residential bills among households."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  licenses:
    - assets/native_android_licenses.txt
  assets:
    - assets/banner.png
    - assets/github-mark-black.png
    - assets/github-mark-white.png
